spring.application.name=healio

# ==========================================
# 1. Cloud Database Configuration (Safe for Public Git)
# ==========================================
# Reads credentials from environment variables. If missing, it will remain blank.
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=true&serverTimezone=UTC
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Cap connections to protect your Clever Cloud free tier connection limits
spring.datasource.hikari.maximum-pool-size=2

# JPA / Hibernate properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ==========================================
# 2. Cloud Apache Kafka Configuration (Safe for Public Git)
# ==========================================
spring.kafka.bootstrap-servers=${KAFKA_HOST}:${KAFKA_PORT}

# Secure SASL_SSL authentication properties required by Confluent Cloud
spring.kafka.properties.security.protocol=${KAFKA_PROTOCOL:SASL_SSL}
spring.kafka.properties.sasl.mechanism=${KAFKA_MECHANISM:PLAIN}
spring.kafka.properties.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username='${KAFKA_USER}' password='${KAFKA_PASS}';

# Consumer & Producer Serializer Configurations
spring.kafka.consumer.group-id=healio-notification-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer