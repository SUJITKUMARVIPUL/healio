name: Healio CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      status: ${{ job.status }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/healio:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/healio:${{ github.sha }}

  # ===================================================================
  # NEW: Automated Deployment Job via SSH
  # ===================================================================
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push # Only runs if the Docker image builds successfully
    steps:
      - name: Execute Remote SSH Commands to Restart Kubernetes Pods
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            echo "Successfully connected to AWS EC2!"
            echo "Triggering Kubernetes rolling update for Healio..."
            microk8s kubectl rollout restart deployment/healio-deployment
            echo "Waiting for rollout to complete verification..."
            microk8s kubectl rollout status deployment/healio-deployment --timeout=60s