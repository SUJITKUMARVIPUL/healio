name: Healio CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Clone the clean source code from GitHub
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up Java 21 environment using safe automated caching
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # Step 3: Compile your jar completely blank (Zero secrets passed or leaked into build history)
      - name: Build with Maven
        run: mvn clean package -DskipTests

      # Step 4: Securely authenticate into Docker Hub via secure secrets
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 5: Initialize the container engine builders
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 6: Package the image and push to your private Docker Hub slot
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/healio:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/healio:${{ github.sha }}