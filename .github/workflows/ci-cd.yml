name: Healio CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ] # Triggers the pipeline when you push to main
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Clone the code onto the GitHub runner
    - name: Checkout Repository
      uses: actions/checkout@v4

    # Step 2: Set up Java 21 JDK environment
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    # Step 3: Build the application jar file using Maven
    - name: Build with Maven
      run: mvn clean package -DskipTests

    # Step 4: Authenticate into your Docker Hub account securely
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # Step 5: Set up Docker Buildx for optimization
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # Step 6: Build the Docker Image from the Dockerfile and push it live
    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/healio:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/healio:${{ github.sha }}